<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .info-box:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .info-value.loading {
            color: #999;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-icon {
            font-size: 40px;
        }

        .weather-details {
            flex: 1;
        }

        .weather-temp {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .weather-desc {
            font-size: 14px;
            color: #666;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }

        .calculator-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .calculator {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
        }

        .calc-display {
            background: #333;
            color: #fff;
            font-size: 24px;
            padding: 15px;
            border-radius: 5px;
            text-align: right;
            margin-bottom: 15px;
            min-height: 50px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .calc-btn {
            background: #667eea;
            color: white;
        }

        .calc-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .calc-btn.operator {
            background: #764ba2;
        }

        .calc-btn.operator:hover {
            background: #63398b;
        }

        .calc-btn.equals {
            background: #22c55e;
            grid-column: span 2;
        }

        .calc-btn.equals:hover {
            background: #16a34a;
        }

        .calc-btn.clear {
            background: #ef4444;
            grid-column: span 2;
        }

        .calc-btn.clear:hover {
            background: #dc2626;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 12px;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .status-info {
            background: #dbeafe;
            color: #1e40af;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .calculator {
                max-width: 100%;
            }

            .calc-buttons {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Visitor Dashboard</h1>
        <p class="subtitle">Your IP, Location & Weather in One Place</p>

        <!-- Info Row: IP, Geolocation, Weather, Calculator -->
        <div class="info-row">
            <div class="info-box">
                <div class="info-label">Your IP Address</div>
                <div class="info-value loading" id="ip-display">
                    <span class="loading-spinner"></span> Loading...
                </div>
            </div>

            <div class="info-box">
                <div class="info-label">Location</div>
                <div class="info-value loading" id="location-display">
                    <span class="loading-spinner"></span> Loading...
                </div>
            </div>

            <div class="info-box">
                <div class="info-label">Today's Weather</div>
                <div id="weather-display" class="info-value loading">
                    <span class="loading-spinner"></span> Loading...
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Calculator Section -->
        <div class="calculator-section">
            <h2>🧮 Simple Calculator</h2>
            <div class="calculator">
                <div class="calc-display" id="calc-display">0</div>
                <div class="calc-buttons">
                    <button class="calc-btn clear" onclick="calcClear()">C</button>
                    <button class="calc-btn operator" onclick="calcAppend('/')">/</button>
                    <button class="calc-btn operator" onclick="calcAppend('*')">×</button>
                    
                    <button class="calc-btn" onclick="calcAppend('7')">7</button>
                    <button class="calc-btn" onclick="calcAppend('8')">8</button>
                    <button class="calc-btn" onclick="calcAppend('9')">9</button>
                    <button class="calc-btn operator" onclick="calcAppend('-')">−</button>
                    
                    <button class="calc-btn" onclick="calcAppend('4')">4</button>
                    <button class="calc-btn" onclick="calcAppend('5')">5</button>
                    <button class="calc-btn" onclick="calcAppend('6')">6</button>
                    <button class="calc-btn operator" onclick="calcAppend('+')">+</button>
                    
                    <button class="calc-btn" onclick="calcAppend('1')">1</button>
                    <button class="calc-btn" onclick="calcAppend('2')">2</button>
                    <button class="calc-btn" onclick="calcAppend('3')">3</button>
                    <button class="calc-btn" onclick="calcAppend('.')">.</button>
                    
                    <button class="calc-btn" onclick="calcAppend('0')">0</button>
                    <button class="calc-btn equals" onclick="calcEquals()">=</button>
                </div>
            </div>
        </div>

        <div id="status-message"></div>
    </div>

    <script>
        // ============ CALCULATOR FUNCTIONS ============
        let calcDisplay = document.getElementById('calc-display');
        let currentInput = '0';

        function calcUpdateDisplay() {
            calcDisplay.textContent = currentInput || '0';
        }

        function calcAppend(value) {
            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            calcUpdateDisplay();
        }

        function calcClear() {
            currentInput = '0';
            calcUpdateDisplay();
        }

        function calcEquals() {
            try {
                currentInput = String(eval(currentInput));
                calcUpdateDisplay();
            } catch (e) {
                currentInput = 'Error';
                calcUpdateDisplay();
                setTimeout(calcClear, 1500);
            }
        }

        // ============ IP & GEOLOCATION ============
        async function fetchVisitorData() {
            try {
                const response = await fetch('backend.php?action=get_visitor_data');
                const data = await response.json();

                if (data.success) {
                    // Display IP
                    document.getElementById('ip-display').textContent = data.ip;

                    // Display Location
                    let locationText = `${data.city}, ${data.country}`;
                    if (data.latitude && data.longitude) {
                        locationText += ` (${data.latitude}, ${data.longitude})`;
                    }
                    document.getElementById('location-display').textContent = locationText;

                    // Fetch and display weather
                    fetchWeather(data.latitude, data.longitude, data.city);

                    // Show success message
                    showStatus('✓ Visitor data loaded and stored!', 'success');
                } else {
                    showStatus('Error: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error fetching visitor data:', error);
                showStatus('Error loading visitor data', 'error');
            }
        }

        // ============ WEATHER ============
        async function fetchWeather(lat, lon, city) {
            try {
                // Using Open-Meteo free API (no key required)
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`
                );
                const data = await response.json();

                if (data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const description = getWeatherDescription(data.current.weather_code, data.current.is_day);
                    const icon = getWeatherIcon(data.current.weather_code, data.current.is_day);

                    const weatherHTML = `
                        <div class="weather-info">
                            <div class="weather-icon">${icon}</div>
                            <div class="weather-details">
                                <div class="weather-temp">${temp}°C</div>
                                <div class="weather-desc">${description}</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('weather-display').innerHTML = weatherHTML;
                }
            } catch (error) {
                console.error('Error fetching weather:', error);
                document.getElementById('weather-display').textContent = 'Weather unavailable';
            }
        }

        function getWeatherIcon(code, isDay) {
            // WMO Weather codes
            if (code === 0) return isDay ? '☀️' : '🌙';
            if (code === 1 || code === 2) return isDay ? '🌤️' : '🌥️';
            if (code === 3) return '☁️';
            if (code === 45 || code === 48) return '🌫️';
            if (code === 51 || code === 53 || code === 55) return '🌧️';
            if (code === 61 || code === 63 || code === 65) return '🌧️';
            if (code === 71 || code === 73 || code === 75) return '❄️';
            if (code === 80 || code === 81 || code === 82) return '⛈️';
            if (code === 85 || code === 86) return '❄️';
            if (code === 95 || code === 96 || code === 99) return '⛈️';
            return '🌤️';
        }

        function getWeatherDescription(code, isDay) {
            // WMO Weather codes
            const descriptions = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Foggy',
                51: 'Light drizzle',
                53: 'Moderate drizzle',
                55: 'Dense drizzle',
                61: 'Slight rain',
                63: 'Moderate rain',
                65: 'Heavy rain',
                71: 'Slight snow',
                73: 'Moderate snow',
                75: 'Heavy snow',
                80: 'Slight showers',
                81: 'Moderate showers',
                82: 'Heavy showers',
                85: 'Slight snow showers',
                86: 'Heavy snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm with hail',
                99: 'Thunderstorm with hail'
            };
            return descriptions[code] || 'Unknown';
        }

        // ============ STATUS MESSAGES ============
        function showStatus(message, type) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            if (type === 'success') {
                setTimeout(() => {
                    statusEl.textContent = '';
                    statusEl.className = '';
                }, 3000);
            }
        }

        // ============ INITIALIZE ============
        document.addEventListener('DOMContentLoaded', () => {
            fetchVisitorData();
        });
    </script>
</body>
</html>
